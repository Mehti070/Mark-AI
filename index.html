<style>
:root{--bg:#f7f7fa;--panel:#fff;--side:#eeeef5;--line:#e0e1ec;--text:#1e2133;--mute:#6b7089;--acc:#5656d6;--acc2:#e6e6fa;--user:#e9e9f5;--code:#f1f1f7;--r:14px}
html[data-theme=dark]{--bg:#14151d;--panel:#1c1e29;--side:#101118;--line:#2a2d3b;--text:#e8e9f1;--mute:#8c90a6;--acc:#8d8df7;--acc2:#2b2e4d;--user:#252941;--code:#0e0f15}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.65 "Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{display:flex;height:100%}
#side{width:272px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 10px;gap:3px;flex:none;transition:margin .2s}
#side.hide{margin-left:-272px}
.brand{font:600 24px Georgia,"Times New Roman",serif;padding:4px 8px 12px}
.brand i{font-style:normal;color:var(--acc)}
.nav{display:flex;gap:10px;align-items:center;background:none;border:0;border-radius:10px;padding:8px 10px;text-align:left}
.nav:hover,.nav.on{background:var(--acc2)}
.lbl{color:var(--mute);font-size:12px;padding:14px 10px 4px}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:1px}
.chat{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:9px;color:var(--mute);cursor:pointer}
.chat span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat:hover,.chat.on{background:var(--acc2);color:var(--text)}
.chat b{font-weight:400;opacity:0;padding:0 4px}
.chat:hover b{opacity:1}
#me{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.av{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
#who{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.ic{background:none;border:0;border-radius:8px;padding:4px 9px;color:var(--mute)}
.ic:hover{background:var(--acc2);color:var(--text)}
.btn{background:var(--acc2);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
#main{flex:1;min-width:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;gap:8px;padding:10px 14px}
#ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status{margin-left:auto;color:var(--mute);font-size:13px}
#msgs{flex:1;overflow:auto;padding:8px 16px}
#pview{flex:1;overflow:auto;padding:8px 16px 16px}
#main[data-v=chat] #pview,#main[data-v=proj] #msgs,#main[data-v=list] #msgs,#main[data-v=list] #comp,#main[data-v=acc] #msgs,#main[data-v=acc] #comp{display:none}
#main.empty #msgs{flex:none;overflow:visible}
#main.empty header{margin-bottom:auto}
#main.empty #comp{margin-bottom:auto}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.pg{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.pg h2{margin:0;font:400 28px Georgia,serif}
.pg label{color:var(--mute);font-size:13px;margin-top:10px}
.pg input,.pg textarea,.pg select,dialog input,dialog textarea,dialog select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.pn{font:400 26px Georgia,serif!important;border:0!important;background:none!important;padding:4px 0!important}
.rowh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--acc)}
.card small{color:var(--mute)}
.kf{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px}
.kf span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m{display:flex;flex-direction:column;gap:4px}
.m small{color:var(--mute);font-size:12px}
.bub{overflow-wrap:anywhere}
.u .bub{background:var(--user);align-self:flex-end;max-width:85%;padding:9px 14px;border-radius:18px}
.u small{align-self:flex-end}
.bub p{margin:.45em 0}.bub ul,.bub ol{margin:.45em 0;padding-left:1.4em}.bub h2,.bub h3,.bub h4,.bub h5{margin:.9em 0 .3em}
.bub code{background:var(--code);padding:1px 6px;border-radius:6px;font:13px Consolas,monospace}
.code{position:relative;background:var(--code);border:1px solid var(--line);border-radius:12px;margin:8px 0}
.code pre{margin:0;padding:12px 14px;overflow:auto;font:13px/1.5 Consolas,monospace}
.code .bar{position:absolute;top:6px;right:6px;display:flex;gap:6px}
.code button,.sm{background:var(--panel);border:1px solid var(--line);border-radius:7px;font-size:12px;padding:2px 10px}
a.sm{text-decoration:none;color:inherit;display:inline-block}
.img{max-width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin-top:6px}
.acts{display:flex;gap:6px;margin-top:6px}
.th{height:120px;border-radius:10px;margin:0 6px 6px 0}
.tag{color:var(--acc);background:var(--acc2);border-radius:6px;padding:0 4px}
#empty{text-align:center;padding:0 0 18px}
#empty h1{font:400 40px/1.2 Georgia,"Times New Roman",serif;margin:0 0 6px}
#empty p{margin:0;color:var(--mute)}
#comp{padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));margin:0}
.box{position:relative;max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:10px 12px 8px;box-shadow:0 2px 14px rgba(30,33,51,.07)}
.box textarea{display:block;width:100%;background:none;border:0;resize:none;outline:none;max-height:220px;padding:4px}
.tools{display:flex;align-items:center;gap:4px;margin-top:4px}
.tools .ic{font-size:17px}.tools .ic.on{background:var(--acc);color:#fff}
#send{margin-left:auto;background:var(--acc);color:#fff;border:0;border-radius:12px;width:36px;height:36px;font-size:18px}
#send[disabled]{opacity:.5}
#chips{display:flex;flex-wrap:wrap;gap:6px}
#chips:not(:empty){margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--acc2);border-radius:10px;padding:3px 8px;font-size:13px}
.chip img{height:36px;border-radius:6px}.chip b{cursor:pointer;color:var(--mute);font-weight:400}
#tg{display:none;z-index:6;position:absolute;left:0;right:0;bottom:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#tg .it{display:flex;gap:10px;align-items:baseline;padding:7px 12px;cursor:pointer}
#tg .it.on,#tg .it:hover{background:var(--acc2)}
#tg b{color:var(--acc);font-weight:600;flex:none}
#tg small{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(520px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog label{display:block;margin:12px 0 4px;color:var(--mute);font-size:13px}
dialog textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#pv{width:min(1100px,96vw);height:88vh;padding:0;overflow:hidden}
#pv[open]{display:flex;flex-direction:column}
#pv header{padding:8px 12px}
#pv iframe{flex:1;border:0;background:#fff}
#auth{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding:16px}

.acard{width:min(380px,100%);display:flex;flex-direction:column;gap:10px;text-align:center}

#authErr{color:#d14b4b;font-size:13px;min-height:18px}
.lnk{background:none;border:0;color:var(--acc);padding:4px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-size:15px}
.sec small{color:var(--mute)}
.who2{display:flex;align-items:center;gap:12px}

.acts{flex-wrap:wrap}
.bub a{color:var(--acc)}

.st b{font-weight:500;color:var(--text)}
.st .sd{white-space:pre-wrap;font-size:13px;margin-top:2px}
.think blockquote{margin:2px 0 0;padding:0;white-space:pre-wrap;font-size:13px;font-style:italic}
.tm{font-size:13px;color:var(--mute);margin-bottom:4px}
.fb{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:2px}

 #side{position:fixed;inset:0 auto 0 0;z-index:5;margin:0!important;transform:translateX(-100%);transition:transform .2s;padding-top:calc(12px + env(safe-area-inset-top,0px))}
 #side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
 #empty h1{font-size:30px}

@media(prefers-reduced-motion:reduce){#side{transition:none}}
</style>
</head>

const esc=t=>t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const TAGRE=/(^|\s)#(\p{L}[\p{L}\p{N}_]*)/gu;
const inl=x=>x.replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,(m,t,u)=>'<a href="'+u.replace(/"/g,"%22")+'" target="_blank" rel="noopener noreferrer">'+t+"</a>");
function blocks(p){let o="",l=null,m;const cl=()=>{if(l){o+="</"+l+">";l=null}};
  for(const ln of p.split("\n")){
    if(m=ln.match(/^(#{1,4})\s+(.*)/)){cl();const n=Math.min(m[1].length+1,5);o+="<h"+n+">"+inl(esc(m[2]))+"</h"+n+">"}
    else if(m=ln.match(/^\s*[-*]\s+(.*)/)){if(l!=="ul"){cl();o+="<ul>";l="ul"}o+="<li>"+inl(esc(m[1]))+"</li>"}
    else if(m=ln.match(/^\s*\d+[.)]\s+(.*)/)){if(l!=="ol"){cl();o+="<ol>";l="ol"}o+="<li>"+inl(esc(m[1]))+"</li>"}
    else{cl();if(ln.trim())o+="<p>"+inl(esc(ln))+"</p>"}}
  cl();return o}
function md(t,u){
  return t.split("```").map((p,i)=>{
    if(i%2){const nl=p.indexOf("\n");const body=nl<0?"":p.slice(nl+1);const lang=(nl<0?p:p.slice(0,nl)).trim();const pv=/^html$/i.test(lang)||/<!doctype html|<html/i.test(body);
      return '<div class="code"><div class="bar">'+(pv?'<button type="button" data-prev>'+L("prev")+'</button>':'')+'<button type="button" data-copy>'+L("copy")+'</button></div><pre>'+esc(body.replace(/\n$/,""))+'</pre></div>'}
    return u?inl(esc(p).replace(TAGRE,'$1<span class="tag">#$2</span>')).replace(/\n/g,"<br>"):blocks(p);
  }).join("");
}

function sysFor(c){const p=c.project&&proj(c.project);let s=S.sys;if(S.name)s+="\n\nПользователя зовут "+S.name+".";if(S.memory&&S.memory.trim())s+="\n\nЧто пользователь просил помнить о себе:\n"+S.memory.trim().slice(-4000);
  if(p){s+="\n\nТы работаешь внутри проекта «"+p.name+"»."+(p.instr?"\nИнструкции проекта:\n"+p.instr:"");
    if(p.know&&p.know.length)s+="\n\nБаза знаний проекта (используй при ответах):\n"+p.know.map(k=>"### "+k.name+"\n"+k.text).join("\n\n").slice(0,60000)}
  return s+learned()}
const apiMsg=m=>({role:m.role,content:m.content,files:(m.att||[]).filter(f=>f.data).map(({name,mime,kind,data})=>({name,mime,kind,data}))});
const IMGRE=/(сгенерируй|создай|сделай|нарисуй|покажи|generate|create|make|draw)( мне| me)?( a| an| одну| пару)? (картинк|фото|изображени|рисунок|иллюстраци|image|picture|photo|illustration)/i;
async function send(text){
  if(busy||(!text.trim()&&!pend.length))return;
  let c=S.view==="proj"?null:cur();
  if(!c){c={id:uid(),title:L("newchat"),msgs:[],project:S.view==="proj"?S.vp:NP,updated:Date.now()};S.chats.unshift(c);S.cur=c.id;S.view="chat";NP=null}
  const wantImg=imgMode||IMGRE.test(text);imgMode=false;$("#imgb").classList.remove("on");
  const att=pend.splice(0);showChips();c.msgs.push({role:"user",content:text||"📎",att});
  if(c.msgs.length===1)c.title=(text||att[0]?.name||"📎").slice(0,40);
  c.updated=Date.now();
  const a={role:"assistant",content:"",live:true},t0=Date.now();
  if(wantImg){a.kind="img";a.w="imgwait"}else{a.think={ms:0,steps:[],th:""};a.thinking=true;startTick(a,t0)}
  c.msgs.push(a);const think=agentMode?"agent":(S.think||"auto");agentMode=false;$("#agb").classList.remove("on");
  let fail="",ok=true;
  busy=true;$("#send").disabled=true;save();render();
  const upd=()=>{const w=$("#wrap").lastElementChild;if(!w||!w.querySelector(".ans"))return;drawThink(w.querySelector(".tk"),a);
    w.querySelector(".ans").innerHTML=md(a.content||(a.think&&(a.think.steps.length||a.think.th)?"":L(a.w||"wait")),false);$("#msgs").scrollTop=1e9};
  try{
    ctrl=new AbortController();
    if(a.kind==="img"){
      const r=await fetch(WORKER,{method:"POST",signal:ctrl.signal,headers:await hdr(),body:JSON.stringify({mode:"image",prompt:text,files:apiMsg(c.msgs[c.msgs.length-2]).files.filter(f=>f.kind==="img")})});
      if(!r.ok){const t=await r.text();throw new Error(r.status+(t?" — "+t.slice(0,300):""))}
      const j=await r.json();a.img=j.image;a.content="🖼 "+text.slice(0,80);
    }else{
      const r=await fetch(WORKER,{method:"POST",signal:ctrl.signal,headers:await hdr(),body:JSON.stringify({mode:"merge",lang:S.lang||"auto",think,web:S.web||"auto",system:sysFor(c),messages:c.msgs.slice(0,-1).map(apiMsg)})});
      if(!r.ok){const t=await r.text();throw new Error(r.status+(t?" — "+t.slice(0,300):""))}
      const T=a.think,lastS=()=>T.steps[T.steps.length-1],closeS=()=>{const x=lastS();if(x&&!x.done){x.done=true;x.ms=Date.now()-x.t0}};
      const ev=o=>{
        if(o.t==="step"){closeS();T.steps.push({label:o.label,detail:o.detail||"",t0:Date.now()})}
        else if(o.t==="detail"){const x=lastS();if(x)x.detail=(x.detail?x.detail+"\n":"")+o.d}
        else if(o.t==="thought")T.th=((T.th||"")+o.d).slice(0,4000);
        else if(o.t==="text"){if(a.thinking){closeS();a.thinking=false;T.ms=Date.now()-t0;clearInterval(tick)}a.content+=o.d}
        else if(o.t==="error")fail=o.m;
        upd()};
      const nd=(r.headers.get("content-type")||"").includes("ndjson"),rd=r.body.getReader(),dec=new TextDecoder();let buf="";
      for(;;){const{done,value}=await rd.read();if(done)break;const ch=dec.decode(value,{stream:true});
        if(!nd){ev({t:"text",d:ch});continue}
        buf+=ch;let i;while((i=buf.indexOf("\n"))>=0){const ln=buf.slice(0,i);buf=buf.slice(i+1);if(ln.trim()){try{ev(JSON.parse(ln))}catch(e){}}}}
      if(fail)throw new Error(fail);
    }
  }catch(e){ok=false;if(e.name!=="AbortError")a.content+=(a.content?"\n\n":"")+L("err")+": "+e.message+"\n\n"+L("chk")}
  clearInterval(tick);
  if(a.think){a.thinking=false;if(!a.think.ms)a.think.ms=Date.now()-t0;const x=a.think.steps[a.think.steps.length-1];if(x&&!x.done){x.done=true;x.ms=Date.now()-x.t0}}
  if(a.kind==="img"&&!a.img)delete a.kind;
  a.live=false;busy=false;ctrl=null;$("#send").disabled=false;c.updated=Date.now();save();render();
  if(ok&&!a.kind&&a.content)autoMemory(a,text)}
const PERS=/(^|\s)(я |мой|моя|моё|мои|мне |меня |люблю|работаю|учусь|хочу|планирую|делаю|создаю|запомни|i am|i'm|my |i like|i work|remember)/i;
async function autoMemory(a,text){if(S.automem==="off"||text.length<15||!PERS.test(text))return;
  try{const r=await fetch(WORKER,{method:"POST",headers:await hdr(),body:JSON.stringify({mode:"memory",user:text,assistant:a.content,memory:S.memory||""})});if(!r.ok)return;
    const j=await r.json(),known=(S.memory||"").toLowerCase(),add=(j.add||[]).filter(f=>!known.includes(f.toLowerCase().slice(0,40)));
    if(add.length){S.memory=((S.memory||"").trim()?S.memory.trim()+"\n":"")+add.map(f=>"• "+f).join("\n");a.mem=add;save();render()}}catch(e){}}

/* ===== Вложения ===== */
function showChips(){const c=$("#chips");c.innerHTML="";pend.forEach((f,i)=>{const d=document.createElement("span");d.className="chip";d.innerHTML=(f.url?'<img alt="">':"📎")+"<span></span><b>✕</b>";if(f.url)d.querySelector("img").src=f.url;d.querySelector("span").textContent=f.name;d.querySelector("b").onclick=()=>{pend.splice(i,1);showChips()};c.appendChild(d)})}
const readF=(f,fn)=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r[fn](f)});
async function addFiles(list){for(const f of list){if(pend.length>=5)break;
  try{
    if(f.type.startsWith("image/")){const u=await readF(f,"readAsDataURL");const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=u});
      const k=Math.min(1,1280/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
      const url=cv.toDataURL("image/jpeg",.85);pend.push({name:f.name||"photo.jpg",kind:"img",mime:"image/jpeg",data:url.split(",")[1],url})}
    else if(f.type==="application/pdf"||/\.pdf$/i.test(f.name)){if(f.size>6e6)throw 0;const u=await readF(f,"readAsDataURL");pend.push({name:f.name,kind:"pdf",mime:"application/pdf",data:u.split(",")[1]})}
    else{if(f.size>150000)throw 0;const t=await readF(f,"readAsText");if(t.includes("\u0000"))throw 0;pend.push({name:f.name,kind:"txt",mime:"text/plain",data:t})}
  }catch(e){$("#status").textContent=L("badfile")+": "+f.name;setTimeout(()=>$("#status").textContent="",3000)}}
  showChips()}

const nrm=s=>s.toLowerCase().replace(/ё/g,"е");
async function loadTags(){TAGS={};try{const u=new URL(WORKER);u.searchParams.set("tags","1");const r=await fetch(u);TAGS=await r.json();if(!Object.keys(TAGS).length)throw 0}catch(e){TAGS={};NAMES.forEach(k=>TAGS[k]="")}}
function hint(){const el=$("#in"),m=el.value.slice(0,el.selectionStart).match(/(^|\s)#([\p{L}\p{N}_]*)$/u);cand=[];
  if(m){const q=nrm(m[2]);cand=Object.keys(TAGS).filter(k=>nrm(k).startsWith(q)).slice(0,8)}
  sel=0;showHint()}
function showHint(){const t=$("#tg");if(!cand.length){t.style.display="none";return}
  t.innerHTML="";cand.forEach((k,i)=>{const d=document.createElement("div");d.className="it"+(i===sel?" on":"");d.innerHTML="<b></b><small></small>";d.firstChild.textContent="#"+k;d.lastChild.textContent=TAGS[k];d.onmousedown=e=>{e.preventDefault();pickTag(k)};t.appendChild(d)});t.style.display="block"}
function pickTag(k){const el=$("#in"),pos=el.selectionStart,b=el.value.slice(0,pos).replace(/#([\p{L}\p{N}_]*)$/u,"#"+k+" ");el.value=b+el.value.slice(pos);el.selectionStart=el.selectionEnd=b.length;cand=[];showHint();el.focus()}

/* ===== События ===== */
$("#comp").onsubmit=e=>{e.preventDefault();const t=$("#in").value;cand=[];showHint();$("#in").value="";$("#in").style.height="auto";send(t)};
$("#in").onkeydown=e=>{if(cand.length){
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();sel=(sel+(e.key==="ArrowDown"?1:-1)+cand.length)%cand.length;showHint();return}
  if(e.key==="Tab"||e.key==="Enter"){e.preventDefault();pickTag(cand[sel]);return}
  if(e.key==="Escape"){cand=[];showHint();return}}
  if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();$("#comp").requestSubmit()}};
$("#in").oninput=e=>{hint();e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,220)+"px"};

async function oauthReturn(){const h=location.hash;if(!/access_token=|error_description=/.test(h))return"";const p=new URLSearchParams(h.slice(1));history.replaceState(null,"",location.pathname+location.search);
  if(p.get("error_description"))return p.get("error_description");
  try{const t=p.get("access_token"),r=await fetch(SB_URL+"/auth/v1/user",{headers:sbh(t)});setSes({access_token:t,refresh_token:p.get("refresh_token"),expires_in:+p.get("expires_in")||3600,user:await r.json()})}catch(e){return e.message}return""}
S=blank();
(async()=>{const err=SB?await oauthReturn():"";if(SB&&!SES){showAuth();$("#authErr").textContent=err;render()}else boot()})();
